<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      注意 CSP 里必须写到 `file:`：这个页面是用 file:// 加载的，而 file:// 的源是不透明的，
      `'self'` 匹配不上，结果就是 **CSS 被静默拦掉** —— 宠物完全由 CSS 画，
      于是窗口一片透明、看着像"没起来"（实测踩过，排查了一轮）。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' file:; script-src 'self' file:; img-src 'self' file: data:;" />
    <title>随时指导</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <!-- 整窗透明：只有 #stage 里的东西会画出来，其余区域靠主进程切鼠标穿透 -->
    <div id="stage">
      <!-- 气泡：右上角那个 × 是"收起"（PowerShell 版也有；没有它就只能等它自己消失） -->
      <div id="bubble" class="hidden">
        <div id="bubbleText"></div>
        <button id="bubbleClose" type="button" title="收起气泡（Esc）" aria-label="收起气泡">&#xE711;</button>
      </div>

      <div id="pet" data-state="idle" title="点我：说一句　双击：打字派活　右键：菜单">
        <!-- 沉默角标：把"看过了但决定不说"变成一个看得见的数字（沿用 PowerShell 版的做法） -->
        <div id="badge" class="hidden"></div>
        <!-- 角色图：有就用它（和 PowerShell 版同一张），没有/加载失败就退回下面自绘的那只 -->
        <img id="petimg" alt="" draggable="false" />
        <div class="body">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
        </div>
        <div class="shadow"></div>
      </div>

      <!-- 打字派活：就一个长圆角输入框 + 一个发送按钮（与 PowerShell 版同一套观感） -->
      <div id="bar" class="hidden">
        <input id="task" type="text" placeholder="说一句，它去做，做完报结论" autocomplete="off" spellcheck="false" />
        <button id="send" type="button">发送</button>
        <button id="close" type="button" title="收起（Esc）">×</button>
      </div>

      <!-- 选项问答 / 审批：DSH 问过来的问题，直接在球上点选（和 PowerShell 版同一套协议） -->
      <div id="ask" class="hidden">
        <div id="askText"></div>
        <div id="askOpts"></div>
        <div id="askCustom">
          <input id="askInput" type="text" placeholder="也可以自己写…" autocomplete="off" spellcheck="false" />
          <button id="askSend" type="button">回答</button>
        </div>
        <div id="askBar"></div>
      </div>

      <!--
        底部功能按钮条：PowerShell 版那颗一排小按钮，一个不少地搬过来。
        图标用 Windows 自带的图标字体（Segoe Fluent Icons，Win10 回退到 Segoe MDL2 Assets）——
        和 PowerShell 版**同一批码位**，零素材。
        为什么是图标不是文字：五个中文标签横着排至少要 300px，桌宠窗口没那么宽。
        悬停时在上面浮一条深色提示说明它是干嘛的（和那边一样）。
      -->
      <div id="tools" class="hidden" role="toolbar" aria-label="桌宠功能">
        <button id="t-ask" type="button" data-icon="&#xE8BD;" data-label="问一句"></button>
        <button id="t-chat" type="button" data-icon="&#xE8F2;" data-label="对话"></button>
        <button id="t-type" type="button" data-icon="&#xE765;" data-label="打字派活"></button>
        <button id="t-region" type="button" data-icon="&#xE7A8;" data-label="框选监控区域"></button>
        <button id="t-history" type="button" data-icon="&#xE81C;" data-label="看它判过什么"></button>
      </div>
      <div id="tip" class="hidden"></div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>
