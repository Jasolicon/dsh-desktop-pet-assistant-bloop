<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      注意 CSP 里必须写到 `file:`：这个页面是用 file:// 加载的，而 file:// 的源是不透明的，
      `'self'` 匹配不上，结果就是 **CSS 被静默拦掉** —— 宠物完全由 CSS 画，
      于是窗口一片透明、看着像"没起来"（实测踩过，排查了一轮）。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' file:; script-src 'self' file:; img-src 'self' file: data:;" />
    <title>随时指导</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <!-- 整窗透明：只有 #stage 里的东西会画出来，其余区域靠主进程切鼠标穿透 -->
    <div id="stage">
      <div id="bubble" class="hidden"></div>

      <div id="pet" data-state="idle" title="点我：说一句　双击：打字派活　右键：菜单">
        <!-- 沉默角标：把"看过了但决定不说"变成一个看得见的数字（沿用 PowerShell 版的做法） -->
        <div id="badge" class="hidden"></div>
        <div class="body">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
        </div>
        <div class="shadow"></div>
      </div>

      <!-- 打字派活：就一个长圆角输入框 + 一个发送按钮（与 PowerShell 版同一套观感） -->
      <div id="bar" class="hidden">
        <input id="task" type="text" placeholder="说一句，它去做，做完报结论" autocomplete="off" spellcheck="false" />
        <button id="send" type="button">发送</button>
      </div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>
