# ============================================================================
# dsh-ambient-guide —— bundle patch（挂载声明）
# ============================================================================
# 只插入我们自己的两行，不覆盖、不修改任何既有插件。
# 卸载：移除本 bundle 即可，profile 里其他插件不受影响。
#
# 安装（需要 dsh CLI）：
#   dsh plugin --profile <profile> add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: ambient-guide
      name: dsh-ambient-guide
      config:
        # 第三阶段：折叠会话操作成行为摘要 + 每轮静默注入 + /ambient 命令 + 可交互控制条。
        # 关掉整个插件：把下面这行改成 false（或整段注释掉）。
        enabled: true
        # 自动发言（每轮结束问一次「有没有值得说的」）。默认关，建议先在面板上手动点「说一句」试。
        # autoSpeak: false
        # 只折叠、不注入（想先观察摘要不想要注入时用）：
        # injectEnabled: true
        # 摘要长度上限（字符）。实测当前摘要约 900 字符 ≈ 576 token/轮。
        # maxDigestChars: 1200
        # 最近动作环形缓冲容量。
        # maxOps: 30
